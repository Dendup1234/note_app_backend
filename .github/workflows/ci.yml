name: API & Mongo Integration Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    # Spin up MongoDB for integration tests
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # App env for CI (change as your app expects)
      NODE_ENV: test
      PORT: 3000
      MONGO_URI: mongodb://localhost:27017/noteapp
      JWT_SECRET: ci-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ---- Start API server in background (black-box tests) ----
      # If your tests import the app (supertest), you don't need this step; it still won't hurt.
      - name: Start API
        run: |
          # Ensure your server binds to 0.0.0.0 and reads PORT
          # e.g., app.listen(process.env.PORT || 3000, "0.0.0.0", ...)
          node server.js &
          npx --yes wait-on http-get://localhost:${PORT}/health --timeout 60000

      - name: Wait for /health
        run: |
          echo "API is up"

      # ---- Option A: Jest/Supertest tests (if present) ----
      - name: Run Jest tests (if package.json has test script)
        run: |
          if npm run | grep -q "^ *test"; then
            npm test --silent || npm run test
          else
            echo "No Jest tests found; skipping."
          fi

      # Upload test reports if any were produced
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-artifacts-${{ github.sha }}
          path: |
            coverage
            junit.xml
            newman-results.xml
          if-no-files-found: ignore

      # Print app logs if something failed (super useful)
      - name: Dump app logs on failure
        if: failure()
        run: |
          echo "----- SERVER LOGS -----"
          tail -n 200 /tmp/app.log || true

      # Stop the background server
      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/app.pid ]; then kill -9 $(cat /tmp/app.pid) || true; fi
